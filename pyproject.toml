[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-server-ops"
version = "0.1.2"
description = "Evidence-bound local workspace service inspection"
readme = "README.md"
requires-python = ">=3.10,<4"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
process = ["psutil>=5.9,<7"]
dev = [
  "pytest==8.3.5",
  "jsonschema==4.23.0",
  "tomli==2.2.1; python_version < '3.11'",
]

[project.scripts]
server-ops = "server_ops.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/server-ops/src"}

[tool.setuptools.packages.find]
where = ["skills/server-ops/src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["skills/server-ops/src"]
