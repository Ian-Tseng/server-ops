name: managed skill repair caller

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate hosted configuration without running an agent or publishing.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  managed-repair:
    uses: Ian-Tseng/analyze-project-claims/.github/workflows/managed-skill-repair.yml@f15311473e33d15f0ab9eee5a4bfca385ff4c5db
    with:
      policy-path: .github/managed-skill-policy.json
      workflow-sha: f15311473e33d15f0ab9eee5a4bfca385ff4c5db
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
