name: managed skill repair caller

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate hosted configuration without running an agent or publishing.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  managed-repair:
    uses: Ian-Tseng/analyze-project-claims/.github/workflows/managed-skill-repair.yml@0fb28f50d9ed84ba47fdbdf2b7d0001f8b4e05b4
    with:
      policy-path: .github/managed-skill-policy.json
      workflow-sha: 0fb28f50d9ed84ba47fdbdf2b7d0001f8b4e05b4
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
