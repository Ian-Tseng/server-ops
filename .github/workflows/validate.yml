name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install "pytest==8.3.5" "jsonschema==4.23.0" "tomli==2.2.1" "psutil>=5.9,<7"
      - name: Run UTF-8 tests
        run: python -X utf8 -m pytest -q
      - name: Verify package manifest
        run: python -X utf8 skills/server-ops/scripts/verify_package.py
